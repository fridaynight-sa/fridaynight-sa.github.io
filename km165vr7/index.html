<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>لوحة المدير · Friday Night</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* the owner's page: only the owner's Google account can read the numbers or post a message
   (the database rules check it, not this page) */
:root{--bg:#fff6e9;--ink:#2b1745;--muted:#6b5a80;--card:#fff;--purple:#7c3aed;--pink:#f03e7a;--green:#12a874;--gold:#ffb21e;--red:#e03131;
  --f-display:"Almarai","Tajawal",system-ui,sans-serif;--f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding:env(safe-area-inset-top,0) 16px calc(40px + env(safe-area-inset-bottom,0))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:var(--f-display);font-size:26px;margin:18px 0 2px;text-align:center;line-height:1.3}
.who{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;align-items:center;font-weight:800;font-size:14px;color:var(--muted);margin-bottom:14px}
.who button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:1px 10px;font:800 13px var(--f-body);cursor:pointer}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:22px;padding:16px;margin-bottom:18px}
.card.c{text-align:center;margin-top:40px}
.card h2{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:20px;margin:0 0 10px}
.card h2 .re{margin-inline-start:auto;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:0 10px;font:800 13px var(--f-body);cursor:pointer}
.card h3{font-family:var(--f-display);font-size:17px;margin:16px 0 0}
.big{font-size:50px;line-height:1.2}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nums div{background:var(--bg);border:2px solid var(--ink);border-radius:16px;padding:8px 12px}
.nums b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.2}
.nums small{color:var(--muted);font-weight:800}
.nums .up{color:var(--green);font-weight:800;font-size:13px}.nums .dn{color:var(--red);font-weight:800;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:26px 4px 4px}
.bars div{flex:1;background:var(--purple);border:2px solid var(--ink);border-radius:8px 8px 3px 3px;position:relative;min-height:6px}
.bars div.t{background:var(--pink)}
.bars div b{position:absolute;top:-22px;left:-4px;right:-4px;text-align:center;font-size:12px}
.days{display:flex;gap:8px;margin:0 4px;font-size:11px;font-weight:800;color:var(--muted)}.days span{flex:1;text-align:center;white-space:nowrap}
.top{margin:8px 0 0;padding:0;list-style:none}
.top li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed #eadff5;font-weight:800}
.top li:last-child{border:0}
.top img{width:30px;height:30px;object-fit:contain;flex:none}
.top .nm{min-width:7.5em}
.top .bar{flex:1;height:10px;background:#f1e8ff;border-radius:9px;overflow:hidden}.top .bar i{display:block;height:100%;background:var(--purple)}
.top b{min-width:28px;text-align:left}
textarea{display:block;width:100%;min-height:80px;border:2px solid var(--ink);border-radius:14px;padding:10px;font:700 17px var(--f-body);background:var(--bg);resize:vertical}
textarea:focus{outline:none;background:#fff;border-color:var(--purple)}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;text-align:center;border:2px solid var(--ink);border-radius:999px;padding:4px 0;font-weight:800;font-size:14px;background:#fff;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{display:block;width:100%;text-align:center;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:14px;padding:11px;font:800 17px var(--f-body);background:var(--purple);color:#fff;margin-top:10px;cursor:pointer;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn:disabled{opacity:.6}
.btn.alt{background:#fff;color:var(--ink)}
.btn.stop{background:#fff;color:var(--red);border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.prev{margin:12px 0 0;font-size:13px;font-weight:800;color:var(--muted)}
.banner{margin-top:6px;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;box-shadow:4px 4px 0 var(--gold);font-weight:800}
.banner span{font-size:22px;flex:none}.banner p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.banner.empty p{opacity:.6}
.now{background:var(--bg);border:2px dashed var(--ink);border-radius:16px;padding:10px 12px 12px;margin-bottom:14px}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:14px;padding:8px;text-align:center;font:800 20px var(--f-display);background:var(--bg)}
.row .btn{width:auto;margin:0;padding:8px 18px}
.small{font-size:13px;color:var(--muted);font-weight:700;margin:8px 0 0}
.msg{min-height:1.4em;font-size:14px;font-weight:800;margin:8px 0 0;text-align:center}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.setup{background:var(--bg);border:2px dashed var(--ink);border-radius:16px;padding:10px;margin:14px 0 4px}
.setup code{display:block;direction:ltr;font:800 15px ui-monospace,Menlo,monospace;overflow-wrap:anywhere;margin:6px 0;user-select:all}
.home{display:block;text-align:center;font-weight:800;color:var(--muted);margin-top:6px}
/* «مين دخل» */
.warn{background:#fff4d6;border:2px solid #d98f00;border-radius:14px;padding:8px 10px;font-size:13px;font-weight:800;color:#7a4b00;margin:0 0 4px}
.dev{border:2px solid var(--ink);border-radius:16px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.dev.anon{border-style:dashed}.dev.banned{border-color:var(--red);background:#fff0f0}
.dev .h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-family:var(--f-display);font-weight:800;font-size:18px}
.dev .h .nm{flex:1;min-width:0}.dev .h .mini{flex:none}
.dev .pills{display:flex;gap:6px;margin-top:2px}
.pill{font:800 12px var(--f-body);border-radius:999px;padding:0 8px}.pill.on{color:var(--green);background:#dcf7ea}.pill.ban{color:#fff;background:var(--red)}
.mini{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:0 10px;font:800 13px var(--f-body);cursor:pointer}
.mini.go{background:var(--purple);color:#fff}.mini.red{color:var(--red);border-color:var(--red)}
.dev ul{margin:4px 0 0;padding:0;list-style:none;font-size:14px;font-weight:700}
.dev li{display:flex;gap:6px}.dev li b{flex:none;width:1.4em;text-align:center}
.dev .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px;font-weight:800}
.dev .nf{display:flex;gap:6px;width:100%}.dev .nf input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:12px;padding:4px 8px;font:800 16px var(--f-body);background:#fff}
/* «إخفاء لعبة» */
.hide{margin:0;padding:0;list-style:none}
.hide li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed #eadff5;font-weight:800}.hide li:last-child{border:0}
.hide li.sub{padding-inline-start:22px;font-size:15px}
.hide img{width:30px;height:30px;object-fit:contain;flex:none}.hide span{flex:1}
.hide button{border:2px solid var(--ink);background:#dcf7ea;border-radius:999px;padding:2px 10px;font:800 13px var(--f-body);cursor:pointer;white-space:nowrap}
.hide button[aria-pressed=true]{background:var(--ink);color:#fff}.hide button:disabled{opacity:.55}
.card.rules{border-color:var(--purple);box-shadow:5px 5px 0 var(--purple)}
.msg a{color:inherit;text-decoration:underline}
/* text and picture next to a name */
.tagl{color:var(--purple)}.mine{font:800 12px var(--f-body);color:var(--muted);background:#f1e8ff;border-radius:999px;padding:0 8px}
.me .row input{font:800 18px var(--f-body);letter-spacing:0}
.av{display:flex;align-items:center;gap:12px;margin-top:8px}
.av img,.av .none{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:var(--bg);flex:none}
.av .none{display:grid;place-items:center;font-size:28px}
.av .btns{display:flex;flex-direction:column;gap:6px;flex:1}.av .btn{margin:0;padding:8px;font-size:15px}
.look{margin-top:12px;background:var(--bg);border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;font-weight:800}
.look img{width:2em;height:2em;border-radius:50%;object-fit:cover;vertical-align:-.6em;margin-inline:.25em;border:2px solid var(--gold)}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="card c"><div class="big">⏳</div><p>لحظة…</p></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../firebase-config.js?v=202610291606"></script>
<script>
(function () {
  "use strict";
  const C = self.FIREBASE_CONFIG || {}, DB = (C.databaseURL || "").replace(/\/$/, "");
  const app = document.getElementById("app"), $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n || 0).toLocaleString("en-US");
  const digits = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  const SETUP = location.hash === "#setup";
  const GAMES = { words: "لوحة الكلمات", dots: "توصيل النقاط", squares: "تذكّر المربعات", lamha: "لمحة", seenjeem: "سين جيم", outside: "برا السالفة",
    sedq: "صدق ولا كذب", mf: "مين فينا؟", draw: "ارسم وخمّن", dafour: "الدافور", tv: "شاشة العرض" };
  const DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  // days and weeks in Saudi time, the same way fnstats.js counts them
  const sa = ms => new Date(ms + 3 * 36e5);
  const dayKey = ms => sa(ms).toISOString().slice(0, 10);
  const weekKey = ms => { const t = sa(ms); return new Date(t.getTime() - t.getUTCDay() * 864e5).toISOString().slice(0, 10); };
  const when = ms => { const t = sa(ms), h = t.getUTCHours(), m = t.getUTCMinutes();
    return `${DAYS[t.getUTCDay()]} <bdi>${t.getUTCDate()}/${t.getUTCMonth() + 1}</bdi> الساعة <bdi>${h % 12 || 12}:${String(m).padStart(2, "0")}</bdi> ${h < 12 ? "ص" : "م"}`; };

  let auth = null, user = null, data = null, dur = "day", flash = null;
  let editing = null, banning = null, tagging = null, allDev = false, rflash = null;   // «مين دخل»: the phone being named / stopped / given a text, show every phone
  const myDev = (() => { try { return (JSON.parse(localStorage.getItem("fn-dev") || "null") || {}).id || ""; } catch (e) { return ""; } })();
  const glyphs = v => self.Intl && Intl.Segmenter ? [...new Intl.Segmenter().segment(v)].length : [...v].length;
  const cleanTag = v => String(v || "").replace(/[\u2060·]/g, "").replace(/\s+/g, " ").trim();
  const MARK = "\u2060";        // a phone whose text is this mark is the owner's (see fnstats.js)
  const NO = "no-rules";                                          // a part the database rules don't open yet
  const NEED = "هذا القسم يحتاج لصق قواعد Firebase الجديدة.";

  /* ---------- the database (its own web address; the account's key goes with each request) ---------- */
  async function call(path, opt, q) {
    const tok = await user.getIdToken();
    const r = await fetch(DB + "/" + path + ".json?auth=" + encodeURIComponent(tok) + (q || ""), opt);
    if (r.status === 401 || r.status === 403) throw "denied";
    if (!r.ok) throw "net";
    return r.json();
  }
  async function load() {
    const now = Date.now(), today = dayKey(now);
    const [days, week, month, games, notice] = await Promise.all([
      call("stats/day", {}, "&orderBy=%22$key%22&startAt=%22" + dayKey(now - 6 * 864e5) + "%22"),
      call("stats/week/" + weekKey(now)), call("stats/month/" + today.slice(0, 7)), call("stats/game/" + today), call("notice")]);
    // the newer parts: until their rules are pasted they say so, and the rest of the page still works
    const soft = p => call(p).catch(e => e === "denied" ? NO : Promise.reject(e));
    const [dev, names, bans, cfg0, tags, users] = await Promise.all([soft("dev"), soft("devname"), soft("ban"), soft("cfg"), soft("tag"), soft("users")]);
    const cfg = cfg0 === NO ? null : cfg0;
    const byDev = {};                                             // phone → the Google account signed in on it
    Object.entries(users && users !== NO ? users : {}).forEach(([uid, u]) => Object.keys((u && u.d) || {}).forEach(d => { if (!byDev[d] || (u.t || 0) > (byDev[d].t || 0)) byDev[d] = Object.assign({ uid }, u); }));
    data = { now, days: days || {}, week: week || 0, month: month || 0, games: games || {}, notice, dev, names: names === NO ? {} : names || {},
      bans: bans === NO ? {} : bans || {}, hide: (cfg && cfg.hide) || {}, me: (cfg && cfg.me) || {}, tags: tags === NO ? {} : tags || {}, tagsNo: tags === NO, byDev,
      need: [dev, names, bans, cfg0, tags, users].includes(NO) };
  }

  /* ---------- screens ---------- */
  function signInView(msg) {
    app.innerHTML = `<div class="card c"><div class="big">🔐</div><h1>لوحة المدير</h1>
      <p class="small">ادخل بحساب Google حقك.</p>
      <button type="button" class="btn" data-a="in">ادخل بحساب Google</button>
      <p class="msg err" role="status">${esc(msg || "")}</p></div><a class="home" href="../">الصفحة الرئيسية</a>`;
  }
  function deniedView() {
    app.innerHTML = `<div class="card c"><div class="big">🔒</div><h1>هذي الصفحة لصاحب الموقع بس</h1>
      <p class="small">حسابك ما عنده صلاحية.</p>
      ${SETUP ? `<div class="setup"><p class="small" style="margin:0">رمز حسابك:</p><code id="uid">${esc(user.uid)}</code>
        <button type="button" class="btn alt" data-a="copy" style="margin-top:4px">انسخ الرمز</button>
        <p class="small">أرسل هذا الرمز لكلود عشان تنفتح لك اللوحة.</p><p class="msg ok" id="cmsg" role="status"></p></div>` : ""}
      <a class="btn" href="../">الصفحة الرئيسية</a><button type="button" class="btn alt" data-a="out">اطلع من الحساب</button></div>`;
  }
  function errorView() {
    app.innerHTML = `<div class="card c"><div class="big">📶</div><h1>ما قدرت أتصل</h1><p class="small">تأكد من النت وجرّب مرة ثانية.</p>
      <button type="button" class="btn" data-a="re">جرّب مرة ثانية</button></div>`;
  }
  const live = n => n && typeof n.t === "string" && n.t.trim() && (!n.e || n.e > Date.now());

  /* ---------- «مين دخل» ---------- */
  const unit = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? n + " " + few : n + " " + many;
  const mins = ms => { const m = Math.max(1, Math.round(ms / 60e3)); if (m < 60) return unit(m, "دقيقة", "دقيقتين", "دقايق", "دقيقة");
    const h = Math.floor(m / 60), r = m % 60; return unit(h, "ساعة", "ساعتين", "ساعات", "ساعة") + (r ? " و" + unit(r, "دقيقة", "دقيقتين", "دقايق", "دقيقة") : ""); };
  const clock = ms => { const t = sa(ms), h = t.getUTCHours(); return `<bdi>${h % 12 || 12}:${String(t.getUTCMinutes()).padStart(2, "0")}</bdi> ${h < 12 ? "ص" : "م"}`; };
  const at = ms => { const k = dayKey(ms), now = Date.now(), t = sa(ms);
    return (k === dayKey(now) ? "اليوم" : k === dayKey(now - 864e5) ? "أمس" : now - ms < 6 * 864e5 ? DAYS[t.getUTCDay()] : `<bdi>${t.getUTCDate()}/${t.getUTCMonth() + 1}</bdi>`) + " " + clock(ms); };
  function who() {
    if (data.dev === NO) return `<p class="small">${NEED}</p>`;
    const list = Object.entries(data.dev || {}).filter(([, v]) => v && v.l).sort((a, b) => b[1].l - a[1].l);
    if (!list.length) return `<p class="small">ما دخل أحد للحين.</p>`;
    const shown = allDev ? list : list.slice(0, 15);
    return shown.map(([id, v]) => phoneRow(id, v)).join("") + (list.length > shown.length ? `<button type="button" class="btn alt" data-a="alldev">عرض الكل (${list.length})</button>` : "");
  }
  function phoneRow(id, v) {
    const now = Date.now(), nm = data.names[id], gu = data.byDev[id], b = data.bans[id], banned = b && b.u > now, on = now - v.l < 150e3;
    const visits = (v.m || {})[dayKey(now).slice(0, 7)] || 0;
    const games = Object.entries(v.g || {}).filter(([k, c]) => GAMES[k] && c > 0).sort((x, y) => y[1] - x[1])
      .map(([k, c]) => esc(GAMES[k]) + " ×" + c + (k === "words" && v.w > 1 ? ` (المستوى ${Math.min(v.w, 401) > 400 ? "خلّصها" : v.w})` : "")).join("، ");
    const typed = String(v.n || "").split("، ").filter(Boolean).map(x => "«" + esc(x) + "»").join("، ");
    const head = editing === id
      ? `<div class="nf"><input id="nmIn" maxlength="40" value="${esc(nm || "")}" placeholder="اسمه" aria-label="اسمه"><button type="button" class="mini go" data-a="nmsave" data-id="${id}">حفظ</button><button type="button" class="mini" data-a="nmx">إلغاء</button></div>`
      : `<span class="nm">${nm ? "🏷️ " + esc(nm) : gu && gu.n ? "🔑 " + esc(gu.n) : "❔ جهاز بدون اسم"}</span><button type="button" class="mini${nm || gu ? "" : " go"}" data-a="nm" data-id="${id}">${nm ? "غيّر الاسم" : "سمّه"}</button>`;
    const tg = data.tags[id], me = tg === MARK || !!(gu && user && gu.uid === user.uid);
    const pills = (me ? `<span class="mine">📌 هذا أنت</span>` : "") + (on ? `<span class="pill on">🟢 داخل الحين</span>` : "") + (banned ? `<span class="pill ban">🚫 محظور</span>` : "");
    const tagLine = tagging === id
      ? `<div class="nf" style="margin-top:6px"><input id="tgIn" maxlength="30" value="${esc(tg || "")}" placeholder="مثلاً: الهداف ⚽" aria-label="الكلام اللي جنب اسمه"><button type="button" class="mini go" data-a="tgsave" data-id="${id}">حفظ</button><button type="button" class="mini" data-a="tgx">إلغاء</button></div>`
      : me ? `<li><b>✨</b>اسمك يطلع فيه بكلامك وصورتك${tg === MARK ? `&nbsp;<button type="button" class="mini" data-a="notme" data-id="${id}">مو أنا</button>` : " (داخل بحسابك)"}</li>`
      : `<li><b>✨</b>${tg ? `جنب اسمه: <span class="tagl">${esc(tg)}</span>` : `<span style="color:var(--muted)">ما فيه كلام جنب اسمه</span>`}&nbsp;<button type="button" class="mini" data-a="tg" data-id="${id}">${tg ? "غيّره" : "اكتب جنبه"}</button>&nbsp;<button type="button" class="mini" data-a="isme" data-id="${id}">📌 هذا أنا</button></li>`;
    const acts = banning === id
      ? `كم مدة الحظر؟ ${[["h", "ساعة"], ["d", "يوم"], ["w", "أسبوع"]].map(([k, l]) => `<button type="button" class="mini red" data-a="bango" data-id="${id}" data-t="${k}">${l}</button>`).join("")}<button type="button" class="mini" data-a="banx">إلغاء</button>`
      : banned ? `🚫 محظور لين ${at(b.u)} <button type="button" class="mini" data-a="unban" data-id="${id}">فك الحظر</button>`
      : `<button type="button" class="mini red" data-a="ban" data-id="${id}">🚫 احظر مؤقتاً</button>`;
    return `<div class="dev${nm || gu ? "" : " anon"}${banned ? " banned" : ""}"><div class="h">${head}</div>${pills && editing !== id ? `<div class="pills">${pills}</div>` : ""}<ul>
      ${gu ? `<li><b>✅</b>داخل بحساب Google${gu.e ? `: <bdi>${esc(gu.e)}</bdi>` : ""}</li>` : ""}

  // the picture: cut to a square from the middle, made small (about 10 KB)
  async function shrink(file) {
    const url = URL.createObjectURL(file);
    try {
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const S = 160, c = document.createElement("canvas"); c.width = c.height = S;
      const k = Math.min(im.naturalWidth, im.naturalHeight), g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, S, S);
      g.drawImage(im, (im.naturalWidth - k) / 2, (im.naturalHeight - k) / 2, k, k, 0, 0, S, S);
      let q = 0.85, out = c.toDataURL("image/jpeg", q);
      while (out.length > 50000 && q > 0.4) { q -= 0.15; out = c.toDataURL("image/jpeg", q); }
      return out;
    } finally { URL.revokeObjectURL(url); }
  }

    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "lv") { e.preventDefault(); const j = document.querySelector("[data-a=jump]"); if (j) j.click(); } });

  /* ---------- start ---------- */
  try {
    if (!DB || !C.apiKey || !self.firebase) throw 0;
    if (!firebase.apps.length) firebase.initializeApp(C);
    auth = firebase.auth();
  } catch (e) { errorView(); return; }
  auth.onAuthStateChanged(u => { user = u || null; if (user) open(); else signInView(); });
})();
</script>
