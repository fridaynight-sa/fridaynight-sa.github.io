<title>شاشة العرض · Friday Night</title>
<meta property="og:type" content="website"><meta property="og:site_name" content="Friday Night"><meta property="og:title" content="شاشة العرض · Friday Night"><meta property="og:description" content="ألعاب جماعية للجمعة: سين جيم، برا السالفة، صدق ولا كذب، مين فينا، ارسم وخمّن. كل واحد يلعب من جواله، والتلفزيون يعرض للكل 🎉"><meta property="og:url" content="https://fridaynight-sa.github.io/tv/"><meta property="og:image" content="https://fridaynight-sa.github.io/og-image.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="ar_SA"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://fridaynight-sa.github.io/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Same look as سين جيم: lavender ground, white rounded cards, purple accent */
:root{
  --bg:#fdf3ff; --surface:#ffffff; --soft:#f6eafd; --line:#ecdcf6;
  --ink:#2b1745; --muted:#7b6890;
  --accent:#7c3aed; --pink:#f03e7a; --gold:#ffb21e; --good:#12a874; --danger:#e03131;
  --shadow:0 6px 22px rgba(92,40,140,.10);
  --f-display:"Almarai","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;padding:env(safe-area-inset-top,0) 16px calc(40px + env(safe-area-inset-bottom,0))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto}
.gamesbar{display:flex;gap:6px;justify-content:center;padding-top:10px}
.gamesbar a{text-decoration:none;font-weight:800;font-size:13px;color:var(--muted);background:var(--surface);padding:5px 12px;border-radius:999px;box-shadow:var(--shadow)}
.gamesbar a.on{background:var(--accent);color:#fff}
.gamesbar{align-items:center;flex-wrap:wrap}
.gamesbar .site{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--ink);direction:ltr;margin-inline-end:4px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
.hdr-r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
#newBtn{background:#fff;white-space:nowrap}
#newBtn.warn{color:var(--danger);border-color:var(--danger)}
.chip{font-weight:800;font-size:13px;background:var(--soft);color:var(--muted);border-radius:999px;padding:4px 12px}
.chip b{color:var(--accent)}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
h2{margin:0 0 10px;font-family:var(--f-display);font-size:22px;font-weight:800}
h3{margin:0 0 6px;font-family:var(--f-display);font-size:18px;font-weight:800}
.note{color:var(--muted);font-weight:700;font-size:14px;margin:6px 0 0}
.err{color:var(--danger);font-weight:800;font-size:14px;margin:8px 0 0;min-height:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:800;font-size:17px;background:var(--accent);color:#fff;width:100%}
.btn:disabled{opacity:.4}
.btn.alt{background:var(--soft);color:var(--accent)}
.btn.pink{background:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.ghost{border:1.5px solid var(--line);padding:7px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.lbl{font-weight:800;font-size:14px;color:var(--muted)}
.inp{background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);font-weight:700;width:100%}
.inp:focus{border-color:var(--accent);background:#fff;outline:none}
.code{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:8px;text-align:center;color:var(--accent);direction:ltr}
.codein{text-align:center;letter-spacing:6px;font-size:24px;text-transform:uppercase;direction:ltr}
.hero{text-align:center;padding:6px 0 12px}
.hero h1{margin:0;font-family:var(--f-display);font-size:clamp(30px,8vw,44px);font-weight:800}
.hero p{margin:4px 0 0;color:var(--muted);font-weight:700}
.modes{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:start;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px;width:100%}
.mode .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--soft);flex:none}
.mode b{display:block;font-family:var(--f-display);font-size:19px}
.mode span{color:var(--muted);font-weight:700;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);font-size:22px;font-weight:800}
.stepper b{font-family:var(--f-display);font-size:22px;min-width:30px;text-align:center}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.plist li{background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:800;display:flex;align-items:center;gap:6px}
.plist li.me{background:var(--accent);color:#fff}
.plist li.done::after{content:"✓";color:var(--good);font-weight:800}
.plist li.me.done::after{color:#fff}
.plist li button{color:var(--danger);font-weight:800}
/* role card: inside and outside look identical until the text is read */
.role{width:100%;height:240px;border-radius:24px;background:linear-gradient(135deg,#2b1745,#4c1d95);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.role.spy{background:linear-gradient(rgba(30,14,52,.80),rgba(60,22,120,.86)),url(spy-map.jpg) center/cover}
/* full-page category background (e.g. the Riyadh map for الجاسوس) */
body.catbg::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--catbg) center/cover no-repeat,#f3f1ea}
body.catbg::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(253,243,255,.18)}
body.catbg .gamesbar a:not(.on),body.catbg .chip{background:#fff}
body.catbg .brand{background:rgba(255,255,255,.9);padding:6px 12px 6px 6px;border-radius:18px}
.role small{font-weight:700;font-size:15px;opacity:.8}
.role .big{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.25}
.role .tap{font-size:44px}
.pairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pairs li{background:var(--soft);border-radius:14px;padding:10px 14px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pairs li i{font-style:normal;color:var(--muted);font-weight:700}
.pairs li.me{outline:2px solid var(--accent)}
.vote{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.vote button{background:var(--soft);border-radius:14px;padding:14px 10px;font-weight:800;font-size:16px}
.vote button.on{background:var(--accent);color:#fff}
.vote button:disabled{opacity:.35}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:10px;align-items:center;font-weight:800}
.bar .tr{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.out .tr i{background:var(--pink)}
.bar.out span:first-child::after{content:" 🤫"}
.bar.win .tr i{background:var(--gold)}
.bar.win span:first-child::after{content:" 👑"}
.board{display:block;width:min(100%,calc(50vh * 4 / 3));aspect-ratio:4/3;background:#fff;border-radius:18px;box-shadow:inset 0 0 0 2px var(--line);margin:8px auto}
.hint{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.tvtop{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;margin:4px 0}
.tvsecs{font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--accent);min-width:2.2ch;text-align:center;background:var(--soft);border-radius:18px;padding:2px 14px}
.hint i{font-style:normal;width:44px;height:54px;border-bottom:4px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:32px}
.hint i.sp{border:0;width:20px}
.chat{list-style:none;margin:8px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chat li{background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:700;font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:var(--soft);border-radius:14px;padding:14px 8px;font-weight:800;font-size:16px}
.opts button.on{background:var(--accent);color:#fff}
.opts button.ok{background:var(--good);color:#fff}
.opts button.bad{background:var(--danger);color:#fff}
table{width:100%;border-collapse:collapse;font-weight:800}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--muted);font-size:13px}
td.n{text-align:center;font-variant-numeric:tabular-nums}
td.plus{color:var(--good)}
.big-msg{text-align:center;font-family:var(--f-display);font-weight:800;font-size:24px;margin:4px 0 10px}
.word{display:inline-block;background:var(--gold);color:#2b1745;border-radius:12px;padding:2px 12px}
.qr{display:block;margin:10px auto 0;width:170px;height:170px;border-radius:14px;background:#fff;padding:8px}
.center{text-align:center}
.mt{margin-top:12px}

/* TV: big type, wide layout */
body{font-size:20px}
.wrap{max-width:1400px}
.tvgrid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media (max-width:900px){.tvgrid{grid-template-columns:1fr}}
.side .code{font-size:56px}
.side .qr{width:220px;height:220px}
.tvq{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4vw,56px);line-height:1.35;text-align:center;margin:10px 0 18px}
.tvimg{display:block;max-width:100%;max-height:48vh;margin:0 auto 16px;border-radius:22px}
.tvopts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tvopts div{background:var(--soft);border-radius:18px;padding:18px 20px;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.6vw,34px);display:flex;flex-direction:column;gap:4px}
.tvopts div.truth{background:#e6f8ef;outline:3px solid var(--good)}
.tvopts small{font-family:var(--f-body);font-size:18px;color:var(--muted);font-weight:700}
.bigplist li{font-size:22px;padding:8px 18px}
.tvpairs li{font-size:26px;padding:14px 18px}
.gic{width:1.25em;height:1.25em;object-fit:contain;vertical-align:-.25em;margin-inline-end:.3em;border-radius:22%}
.chip .gic{width:20px;height:20px;vertical-align:-5px}
.tvgames{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.tvgames span{display:inline-flex;align-items:center;background:var(--soft);border-radius:999px;padding:5px 12px 5px 14px;font-weight:800;font-size:15px}
.tvgames .gic{width:28px;height:28px;vertical-align:middle}
.tvtitle{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.4vw,44px);text-align:center;margin:0 0 12px}
.tvsub{text-align:center;color:var(--muted);font-weight:800;font-size:22px;margin:0 0 14px}
/* الدافور's four options (its own names, so صدق ولا كذب's .tvopts stay as they were) */
.dfopts{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px;margin:6px 0 16px}
.dfopts div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center}
.dfopts b{font-size:16px;color:var(--muted)}.dfopts small{font-family:var(--f-body);font-size:16px}
.dfopts .ok{background:#12a874;color:#fff;border-color:#0b7a54}.dfopts .ok b{color:#fff}.dfopts .dim{opacity:.45}
/* full screen: more room for the game, the games bar steps aside */
body.fs .gamesbar{display:none}
.hdr-r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.joinbox{display:flex;flex-direction:column;gap:12px;max-width:520px;margin:30px auto}
.tbar{height:12px;background:var(--soft);border-radius:999px;overflow:hidden;margin:4px 0 16px}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s linear}
.galgrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px 0}
.galgrid figure{margin:0;width:min(30%,340px);text-align:center}
.galimg{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 2px var(--line)}
.galimg.wait{display:grid;place-items:center;font-size:40px}
.galgrid figcaption{font-weight:800;font-size:20px;margin-top:6px}
.awardrow{display:flex;gap:18px;flex-wrap:wrap}.awardrow .awardc{flex:1 1 300px}
.awardc .galgrid figure{width:min(100%,460px)}
.awardc .plus{color:var(--good)}
.podium{display:grid;gap:10px}
.podium div{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:16px;padding:14px 18px;font-weight:800;font-size:26px}
.podium div:first-child{background:var(--gold)}
.bar{font-size:22px}
</style>
<style>
/* games bar: one row that scrolls sideways on phones */
.gamesbar{flex-wrap:nowrap!important;justify-content:flex-start!important;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:10px 16px 6px}
.gamesbar::-webkit-scrollbar{display:none}
.gamesbar a{flex:none;white-space:nowrap}
.gamesbar a.site{background:none;box-shadow:none;padding:5px 2px;color:var(--ink);font-family:var(--f-display);font-size:14px;direction:ltr}
.gamesbar a.site img{vertical-align:-5px;margin-inline-end:4px}
@media (min-width:820px){.gamesbar{justify-content:center!important;margin-inline:0;padding-inline:0}}
</style>
