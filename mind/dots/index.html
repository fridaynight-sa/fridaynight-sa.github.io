<style>
.hero{text-align:center;padding:10px 0 6px}
.hero img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(124,92,255,.5))}
.hero h1{font-family:var(--f-display);font-size:clamp(34px,9vw,48px);margin:4px 0 0}
.hero p{margin:0;color:#9fe3ff;font-weight:800}
.record{display:flex;align-items:center;justify-content:space-around;gap:12px;text-align:center;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(62,198,255,.25));border-color:rgba(127,224,255,.5)}
.record small{display:block;color:var(--muted);font-weight:800}
.record b{font-family:var(--f-display);font-size:28px;direction:ltr;unicode-bidi:isolate}
.record .of{font-size:16px;color:var(--muted)}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog>div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}
.prog b{font-family:var(--f-display);font-size:20px}
.prog small{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:4px}
.steps{margin:0;padding-inline-start:22px}.steps li{margin:5px 0}
.note{background:rgba(255,212,59,.1);border:1px solid rgba(255,212,59,.4);border-radius:14px;padding:10px 12px;font-size:14px}
.done{background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(62,198,255,.2));border-color:rgba(52,211,153,.6)}
.tip{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
.big{text-align:center}
.big .n{font-family:var(--f-display);font-size:64px;line-height:1.1;direction:ltr;unicode-bidi:isolate;background:linear-gradient(90deg,#b7a6ff,#7fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.big .u{color:var(--muted);font-weight:800}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stats div{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 14px;text-align:center;font-weight:800}
.stats small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.msg{font-weight:700}
ol.tops{margin:0;padding-inline-start:26px}ol.tops li{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--line)}ol.tops li:last-child{border:0}
ol.tops li b{font-family:var(--f-display);direction:ltr;unicode-bidi:isolate}ol.tops li.me{color:var(--gold)}
ol.tops{list-style-position:outside}

/* playing: the whole screen is the game and nothing moves under your finger */
body.playing{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;padding:0;background:#350350}
body.playing .gamesbar{display:none}
body.playing .wrap{max-width:none;height:100%;background:linear-gradient(180deg,#350350 0,#350350 var(--hh,0px),#42107a var(--hh,0px),#22348c 55%,#0257a0 100%)}
body.playing #app{height:100%}
.pl{display:grid;grid-template-columns:100%;grid-template-rows:auto auto auto minmax(0,1fr) auto;grid-template-areas:'top' 'time' 'tools' 'board' 'msg';height:100%;max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ptop{display:flex;align-items:center;gap:8px}
.ptop .pill{flex:1;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;font-weight:800;min-width:0}
.ptop .pill b{font-family:var(--f-display);font-size:18px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}.ptop .pill b#pi{direction:rtl}
.ptop .pause{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);font-size:20px;display:grid;place-items:center}
.ptime{height:8px;margin:10px 0 0;background:rgba(255,255,255,.14);border-radius:8px;overflow:hidden}.ptime i{display:block;height:100%;width:100%;background:#c54cb5;border-radius:8px}
.ptools{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0 4px;font-size:13px;font-weight:800}
.ptools{padding-top:20px}.ptools .hint{background:#cf1073;border-radius:999px;border-start-start-radius:0;border-end-start-radius:0;margin-inline-start:-12px;padding:8px 22px 8px 18px;font-family:var(--f-display);font-weight:800;font-size:17px}
.ptop{grid-area:top}.ptime{grid-area:time}.ptools{grid-area:tools}.pmsg{grid-area:msg}
.pboard{grid-area:board;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
/* phone on its side: the buttons go beside the board so the board can use the whole height */
@media (orientation:landscape) and (max-height:560px){
  .pl{max-width:none;grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:auto auto auto auto 1fr;grid-template-areas:'board top' 'board time' 'board tools' 'board msg' 'board .';column-gap:16px;padding-inline:calc(12px + env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-right,0px))}
  .ptools{flex-direction:column;align-items:flex-start;padding-top:12px}.ptools .hint{margin-inline-start:0;border-radius:999px}
  .ptop .pill{padding:6px 10px}.ptop .pill b{font-size:16px}
  .pmsg{text-align:start}
}
.pboard canvas{display:block;touch-action:none;border-radius:12px}
.pmsg{min-height:1.8em;margin:4px 0 0;text-align:center;font-weight:800;font-size:16px}
.ov{position:fixed;inset:0;z-index:90;background:rgba(8,10,36,.7);display:grid;place-items:center;padding:16px}
.ov .box{width:min(360px,100%);background:#1d2160;border:1.5px solid var(--line);border-radius:22px;padding:20px;text-align:center}
.ov h2{font-family:var(--f-display);margin:0 0 4px}
</style>
