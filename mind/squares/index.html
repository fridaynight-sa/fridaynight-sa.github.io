<meta name="description" content="تذكّر المربعات: مربعات تنوّر وحدة ورا الثانية، وأنت تضغطها بنفس الترتيب. كل ما جبتها صح يزيد مربع.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Friday Night"><meta property="og:title" content="🟨 تذكّر المربعات · Mind Games"><meta property="og:description" content="مربعات تنوّر وحدة ورا الثانية، وأنت تضغطها بنفس الترتيب. كل ما جبتها صح يزيد مربع."><meta property="og:url" content="https://fridaynight-sa.github.io/mind/squares/"><meta property="og:image" content="https://fridaynight-sa.github.io/og-image.jpg"><meta property="og:locale" content="ar_SA"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://fridaynight-sa.github.io/og-image.jpg">

<style>
.hero{text-align:center;padding:10px 0 6px}
.hero img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(124,92,255,.5))}
.hero h1{font-family:var(--f-display);font-size:clamp(34px,9vw,48px);margin:4px 0 0}
.hero p{margin:0;color:#9fe3ff;font-weight:800}
.record{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(62,198,255,.25));border-color:rgba(127,224,255,.5)}
.record b{font-family:var(--f-display);font-size:28px}
.record small{display:block;color:var(--muted);font-weight:700}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;border-radius:16px;padding:12px 8px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:16px;line-height:1.3}
.seg button small{display:block;font-weight:700;font-size:12px;color:var(--muted)}
.seg button.on{border-color:#7fe0ff;background:linear-gradient(135deg,rgba(124,92,255,.45),rgba(62,198,255,.3))}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog>div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}
.prog b{font-family:var(--f-display);font-size:20px}
.prog small{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:4px}
.note{background:rgba(255,212,59,.1);border:1px solid rgba(255,212,59,.4);border-radius:14px;padding:10px 12px;font-size:14px}
.tip{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
.strip{display:flex;gap:6px;justify-content:center;align-items:flex-start}
.strip .s{flex:1;text-align:center}
.strip .g{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;max-width:70px;margin:0 auto 6px}
.strip .g i{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.1);font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center}
.strip .g i.on{background:#ffd43b;box-shadow:0 0 8px #ffd43b;color:#2b1745}
.strip .g i.ok{background:var(--good);color:#fff}
.strip small{display:block;font-weight:800;font-size:12px}
.strip .arrow{align-self:center;color:var(--muted);font-weight:800}
.big{text-align:center}
.big .v{font-family:var(--f-display);font-size:58px;line-height:1.15;background:linear-gradient(90deg,#ffe066,#7fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.big .u{color:var(--muted);font-weight:800}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stats div{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 14px;text-align:center;font-weight:800}
.stats small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;justify-content:center;margin-top:26px;flex-wrap:nowrap}
.bars div{flex:0 1 32px;min-width:14px;border-radius:7px 7px 3px 3px;background:linear-gradient(#7fe0ff,#7c5cff);position:relative}
.bars div.bad{background:linear-gradient(#fb7185,#9f1239);opacity:.7}
.bars div.top{background:linear-gradient(#ffe066,#ffb21e)}
.bars div b{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:13px}

/* playing: the whole screen is the game and nothing moves under your finger */
body.playing{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;padding:0}
body.playing .gamesbar{display:none}
body.playing .fx-mute{display:none!important}   /* the pause menu has the sound switch */
body.playing .wrap{max-width:none;height:100%}
body.playing #app{height:100%}
.pl{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:14px}
.ptop .x{flex:none;width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.ptop .n{background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:999px;padding:4px 14px;font-family:var(--f-display);font-size:18px;white-space:nowrap}
.hearts{font-size:20px;letter-spacing:2px;white-space:nowrap}
.say{text-align:center;font-family:var(--f-display);font-size:clamp(19px,5.4vw,24px);margin:14px 0 2px;min-height:1.5em}
.sub{text-align:center;color:var(--muted);font-weight:700;margin:0;min-height:1.6em}
.mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.sq{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,calc(100dvh - 260px),460px);min-width:220px}
.sq button{aspect-ratio:1;border-radius:20px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);font-family:var(--f-display);font-size:clamp(24px,8vw,40px);font-weight:800;color:#fff;transition:transform .1s,box-shadow .12s,background .12s}
.sq button:disabled{opacity:1;cursor:default}
.sq.input button:active{transform:scale(.95)}
.sq button.on{background:radial-gradient(circle at 35% 30%,#fff,#ffd43b 55%,#c98a00);border-color:#fff;box-shadow:0 0 30px #ffd43b;color:#2b1745;transform:scale(1.05)}
.sq button.ok{background:var(--good);border-color:#fff}
.sq button.pop{animation:sqpop .25s cubic-bezier(.2,1.6,.4,1)}@keyframes sqpop{from{transform:scale(.8)}}
.sq button.bad{background:var(--bad);border-color:#fff}
.sq button.was{border:3px dashed #ffd43b;color:#ffd43b}
.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:30px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.ov{position:fixed;inset:0;z-index:90;background:rgba(8,10,36,.75);display:grid;place-items:center;padding:16px}
.ov .box{width:min(360px,100%);background:#1d2160;border:1.5px solid var(--line);border-radius:22px;padding:20px;text-align:center}
.ov h2{font-family:var(--f-display);margin:0 0 4px}
@media (orientation:landscape) and (max-height:560px){
  .pl{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:auto auto auto 1fr;grid-template-areas:'mid top' 'mid say' 'mid sub' 'mid .';column-gap:20px}
  .ptop{grid-area:top}.say{grid-area:say}.sub{grid-area:sub}.mid{grid-area:mid}
  .sq{width:min(100%,calc(100dvh - 40px),460px)}
}
</style>
