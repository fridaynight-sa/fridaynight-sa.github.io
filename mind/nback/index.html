<meta name="description" content="تذكّر المربعات: تمرين الذاكرة العاملة. اضغط إذا نوّر نفس المكان اللي قبل كم خطوة. عادية أو مزدوجة مع الصوت.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Friday Night"><meta property="og:title" content="🧠 تذكّر المربعات · Mind Games"><meta property="og:description" content="تمرين الذاكرة العاملة: اضغط إذا نوّر نفس المكان اللي قبل كم خطوة. عادية أو مزدوجة مع الصوت."><meta property="og:url" content="https://fridaynight-sa.github.io/mind/nback/"><meta property="og:image" content="https://fridaynight-sa.github.io/og-image.jpg"><meta property="og:locale" content="ar_SA"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://fridaynight-sa.github.io/og-image.jpg">

<link rel="stylesheet" href="../mind.css?v=1">
<style>
.hero{text-align:center;padding:10px 0 6px}
.hero img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 10px 24px rgba(124,92,255,.5))}
.hero h1{font-family:var(--f-display);font-size:clamp(34px,9vw,48px);margin:4px 0 0}
.hero p{margin:0;color:#9fe3ff;font-weight:800}
.record{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(62,198,255,.25));border-color:rgba(127,224,255,.5)}
.record b{font-family:var(--f-display);font-size:28px}
.record small{display:block;color:var(--muted);font-weight:700}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;border-radius:16px;padding:12px 8px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:16px;line-height:1.3}
.seg button small{display:block;font-weight:700;font-size:12px;color:var(--muted)}
.seg button.on{border-color:#7fe0ff;background:linear-gradient(135deg,rgba(124,92,255,.45),rgba(62,198,255,.3))}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog>div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px}
.prog b{font-family:var(--f-display);font-size:20px}
.prog small{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:4px}
.note{background:rgba(255,212,59,.1);border:1px solid rgba(255,212,59,.4);border-radius:14px;padding:10px 12px;font-size:14px}
.tip{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
.strip{display:flex;gap:6px;justify-content:center;align-items:flex-start}
.strip .s{flex:1;text-align:center}
.strip .g{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%;max-width:70px;margin:0 auto 6px}
.strip .g i{aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.1)}
.strip .g i.on{background:#3ec6ff;box-shadow:0 0 8px #3ec6ff}
.strip small{display:block;font-weight:800;font-size:12px}
.strip .yes small{color:var(--good)}
.strip .arrow{align-self:center;color:var(--muted);font-weight:800}
.big{text-align:center}
.big .v{font-family:var(--f-display);font-size:58px;line-height:1.15;background:linear-gradient(90deg,#b7a6ff,#7fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.big .u{color:var(--muted);font-weight:800}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stats div{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 14px;text-align:center;font-weight:800}
.stats small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;justify-content:center;margin-top:26px}
.bars div{width:40px;border-radius:8px 8px 4px 4px;background:linear-gradient(#7fe0ff,#7c5cff);position:relative}
.bars div.top{background:linear-gradient(#ffe066,#ffb21e)}
.bars div b{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:14px}

/* playing: the whole screen is the game and nothing moves under your finger */
body.playing{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;padding:0}
body.playing .gamesbar{display:none}
body.playing .fx-mute{display:none!important}   /* it would sit on the answer buttons; the pause menu has the sound switch */
body.playing .wrap{max-width:none;height:100%}
body.playing #app{height:100%}
.pl{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:14px}
.ptop .x{flex:none;width:42px;height:42px;border-radius:50%;background:var(--card2);font-size:18px}
.ptop .n{background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:999px;padding:4px 14px;font-family:var(--f-display);font-size:18px;white-space:nowrap}
.pbar{margin:10px 0 0}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.streak{height:30px;font-family:var(--f-display);font-weight:800;font-size:20px;color:#ffb21e;text-align:center}
.streak b{display:inline-block;animation:pop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{from{transform:scale(.4)}}
.nb{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,calc(100dvh - 360px),440px);min-width:220px}
.nb i{aspect-ratio:1;border-radius:20px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);transition:transform .12s,box-shadow .12s,background .12s}
.nb i.on{background:radial-gradient(circle at 35% 30%,#fff,var(--c) 55%,var(--c2));border-color:#fff;box-shadow:0 0 30px var(--c);transform:scale(1.05)}
.nb i.miss{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad) inset}
.nb i.hit{border-color:var(--good);box-shadow:0 0 0 4px var(--good) inset}
.cd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:96px;font-weight:800;color:#fff;text-shadow:0 6px 30px rgba(124,92,255,.9);pointer-events:none}
.hintline{text-align:center;color:var(--muted);font-weight:700;margin:10px 0 0;min-height:1.6em}
.keys{display:flex;gap:10px;margin-top:10px}
.keys button{flex:1;border-radius:22px;padding:18px 8px;font-family:var(--f-display);font-size:clamp(16px,5vw,22px);white-space:nowrap;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 30px rgba(92,80,255,.4);transition:transform .08s,background .15s}
.keys button:active{transform:scale(.97)}
.keys button.snd{background:linear-gradient(135deg,#ff5fd2,#a855f7)}
.keys button.ok{background:var(--good)}.keys button.bad{background:var(--bad)}
.keys button:disabled{opacity:.45}
.keys small{display:block;font-family:var(--f-body);font-size:12px;opacity:.75;margin-top:2px}
.between{position:absolute;inset:0;display:grid;place-items:center;padding:8px}
.between .box{width:min(360px,100%);background:#1d2160;border:1.5px solid var(--line);border-radius:22px;padding:18px;text-align:center}
.between h2{font-family:var(--f-display);margin:0 0 6px}
.up{color:var(--good)}.down{color:#ffb21e}
.ov{position:fixed;inset:0;z-index:90;background:rgba(8,10,36,.75);display:grid;place-items:center;padding:16px}
.ov .box{width:min(360px,100%);background:#1d2160;border:1.5px solid var(--line);border-radius:22px;padding:20px;text-align:center}
.ov h2{font-family:var(--f-display);margin:0 0 4px}
@media (orientation:landscape) and (max-height:560px){
  .pl{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 260px;grid-template-rows:auto auto 1fr auto;grid-template-areas:'mid top' 'mid bar' 'mid line' 'mid keys';column-gap:20px}
  .ptop{grid-area:top}.pbar{grid-area:bar}.mid{grid-area:mid}.hintline{grid-area:line;align-self:center}.keys{grid-area:keys;flex-direction:column}
  .nb{width:min(100%,calc(100dvh - 90px),440px)}
}
</style>
</head>
