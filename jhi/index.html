<style>
/* Same look as سين جيم: lavender ground, white rounded cards, purple accent */
:root{
  --bg:#fdf3ff; --surface:#ffffff; --soft:#f6eafd; --line:#ecdcf6;
  --ink:#2b1745; --muted:#7b6890;
  --accent:#7c3aed; --pink:#f03e7a; --gold:#ffb21e; --good:#12a874; --danger:#e03131;
  --shadow:0 6px 22px rgba(92,40,140,.10);
  --f-display:"Almarai","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;padding:env(safe-area-inset-top,0) 16px calc(40px + env(safe-area-inset-bottom,0))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto}
.gamesbar{display:flex;gap:6px;justify-content:center;padding-top:10px}
.gamesbar a{text-decoration:none;font-weight:800;font-size:13px;color:var(--muted);background:var(--surface);padding:5px 12px;border-radius:999px;box-shadow:var(--shadow)}
.gamesbar a.on{background:var(--accent);color:#fff}
.gamesbar{align-items:center;flex-wrap:wrap}
.gamesbar .site{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--ink);direction:ltr;margin-inline-end:4px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1}
.brand .logo{width:44px;height:44px;border-radius:14px;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
.hdr-r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
#newBtn{background:#fff;white-space:nowrap}
#newBtn.warn{color:var(--danger);border-color:var(--danger)}
.chip{font-weight:800;font-size:13px;background:var(--soft);color:var(--muted);border-radius:999px;padding:4px 12px}
.chip b{color:var(--accent)}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
h2{margin:0 0 10px;font-family:var(--f-display);font-size:22px;font-weight:800}
h3{margin:0 0 6px;font-family:var(--f-display);font-size:18px;font-weight:800}
.note{color:var(--muted);font-weight:700;font-size:14px;margin:6px 0 0}
.err{color:var(--danger);font-weight:800;font-size:14px;margin:8px 0 0;min-height:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:800;font-size:17px;background:var(--accent);color:#fff;width:100%}
.btn:disabled{opacity:.4}
.btn.alt{background:var(--soft);color:var(--accent)}
.btn.pink{background:var(--pink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.ghost{border:1.5px solid var(--line);padding:7px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.lbl{font-weight:800;font-size:14px;color:var(--muted)}
.inp{background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);font-weight:700;width:100%}
.inp:focus{border-color:var(--accent);background:#fff;outline:none}
.code{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:8px;text-align:center;color:var(--accent);direction:ltr}
.codein{text-align:center;letter-spacing:6px;font-size:24px;text-transform:uppercase;direction:ltr}
.hero{text-align:center;padding:6px 0 12px}
.hero h1{margin:0;font-family:var(--f-display);font-size:clamp(30px,8vw,44px);font-weight:800}
.hero p{margin:4px 0 0;color:var(--muted);font-weight:700}
.modes{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:start;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px;width:100%}
.mode .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--soft);flex:none}
.mode b{display:block;font-family:var(--f-display);font-size:19px}
.mode span{color:var(--muted);font-weight:700;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;background:var(--soft);color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.seg button.inf{flex-basis:100%}
.finish{display:block;width:100%;margin-top:4px;padding:12px;border-radius:16px;border:2px dashed var(--danger);background:#fff5f5;color:var(--danger);font-weight:800;font-size:16px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);font-size:22px;font-weight:800}
.stepper b{font-family:var(--f-display);font-size:22px;min-width:30px;text-align:center}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.plist li{background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:800;display:flex;align-items:center;gap:6px}
.plist li.me{background:var(--accent);color:#fff}
.plist li.done::after{content:"✓";color:var(--good);font-weight:800}
.plist li.me.done::after{color:#fff}
.plist li button{color:var(--danger);font-weight:800}
/* role card: inside and outside look identical until the text is read */
.role{width:100%;height:240px;border-radius:24px;background:linear-gradient(135deg,#2b1745,#4c1d95);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.role.spy{background:linear-gradient(rgba(30,14,52,.80),rgba(60,22,120,.86)),url(spy-map.jpg) center/cover}
/* full-page category background (e.g. the Riyadh map for الجاسوس) */
body.catbg::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--catbg) center/cover no-repeat,#f3f1ea}
body.catbg::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(253,243,255,.18)}
body.catbg .gamesbar a:not(.on),body.catbg .chip{background:#fff}
body.catbg .brand{background:rgba(255,255,255,.9);padding:6px 12px 6px 6px;border-radius:18px}
.role small{font-weight:700;font-size:15px;opacity:.8}
.role .big{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.25}
.role .tap{font-size:44px}
.pairs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pairs li{background:var(--soft);border-radius:14px;padding:10px 14px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pairs li i{font-style:normal;color:var(--muted);font-weight:700}
.pairs li.me{outline:2px solid var(--accent)}
.vote{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.vote button{background:var(--soft);border-radius:14px;padding:14px 10px;font-weight:800;font-size:16px}
.vote button.on{background:var(--accent);color:#fff}
.vote button:disabled{opacity:.35}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:10px;align-items:center;font-weight:800}
.bar .tr{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.out .tr i{background:var(--pink)}
.bar.out span:first-child::after{content:" 🤫"}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{background:var(--soft);border-radius:14px;padding:14px 8px;font-weight:800;font-size:16px}
.opts button.on{background:var(--accent);color:#fff}
.opts button.ok{background:var(--good);color:#fff}
.opts button.bad{background:var(--danger);color:#fff}
table{width:100%;border-collapse:collapse;font-weight:800}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--muted);font-size:13px}
td.n{text-align:center;font-variant-numeric:tabular-nums}
td.plus{color:var(--good)}
.big-msg{text-align:center;font-family:var(--f-display);font-weight:800;font-size:24px;margin:4px 0 10px}
.word{display:inline-block;background:var(--gold);color:#2b1745;border-radius:12px;padding:2px 12px}
.qr{display:block;margin:10px auto 0;width:170px;height:170px;border-radius:14px;background:#fff;padding:8px}
.center{text-align:center}
.mt{margin-top:12px}

.stmt{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,6vw,30px);line-height:1.45;text-align:center;margin:6px 0 12px}
.qimg{display:block;width:100%;max-height:300px;object-fit:cover;border-radius:18px;margin-bottom:12px;background:var(--soft)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf button{padding:22px 10px;border-radius:20px;font-family:var(--f-display);font-weight:800;font-size:24px;color:#fff}
.tf .yes{background:var(--good)}.tf .no{background:var(--danger)}
.tf button:disabled{opacity:.35}
.tbar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:4px 0 14px}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s linear}
.verdict{text-align:center;font-family:var(--f-display);font-weight:800;font-size:34px;margin:4px 0}
.verdict.yes{color:var(--good)}.verdict.no{color:var(--danger)}
.res li{display:flex;justify-content:space-between;gap:8px;background:var(--soft);border-radius:12px;padding:8px 12px;font-weight:800;margin-bottom:6px}
.res{list-style:none;margin:0;padding:0}
.res .ok{color:var(--good)}.res .bad{color:var(--danger)}
.catv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.catv button{background:var(--soft);border-radius:14px;padding:12px 10px;font-weight:800;text-align:start;display:flex;justify-content:space-between;gap:6px}
.catv button.on{background:var(--accent);color:#fff}
.catv button small{opacity:.8}
.podium{display:grid;gap:8px}
.podium div{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:14px;padding:12px 14px;font-weight:800;font-size:18px}
.podium div:first-child{background:var(--gold)}
.answers{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.answers li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 14px;font-weight:800}
.answers li div{display:flex;flex-direction:column}
.answers li small{color:var(--muted);font-weight:700}
.answers li span{font-size:14px;color:var(--muted);text-align:end}
.answers li.truth{background:#e6f8ef;outline:2px solid var(--good)}
.opts button:disabled{opacity:.45}
.bar.win .tr i{background:var(--gold)}
.bar.win span:first-child::after{content:" 👑"}
.brand{white-space:nowrap}
.titles{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.titles li{display:flex;flex-direction:column;background:var(--soft);border-radius:14px;padding:10px 14px}
.titles li b{font-family:var(--f-display);font-size:18px}
.titles li span{color:var(--muted);font-weight:700;font-size:14px}
</style>
<style>
/* games bar: one row that scrolls sideways on phones */
.gamesbar{flex-wrap:nowrap!important;justify-content:flex-start!important;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:10px 16px 6px}
.gamesbar::-webkit-scrollbar{display:none}
.gamesbar a{flex:none;white-space:nowrap}
.gamesbar a.site{background:none;box-shadow:none;padding:5px 2px;color:var(--ink);font-family:var(--f-display);font-size:14px;direction:ltr}
.gamesbar a.site img{vertical-align:-5px;margin-inline-end:4px}
@media (min-width:820px){.gamesbar{justify-content:center!important;margin-inline:0;padding-inline:0}}
</style>

<style>

/* 📓 the notebook look */
.nbdesk{background:radial-gradient(circle at 30% 20%,#3a3442,#16131c 75%);border-radius:18px;padding:14px 12px 20px 12px;box-shadow:inset 0 0 40px rgba(0,0,0,.6);margin:0 -4px}
.nbstack{position:relative}
.nbstack::before,.nbstack::after{content:"";position:absolute;inset:6px -3px -6px 3px;background:#ecebe6;border-radius:4px 12px 12px 4px;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.nbstack::after{inset:3px -1px -3px 1px;background:#f4f3ee}
.nbpaper{position:relative;z-index:1;transform:rotate(-.5deg);background-color:#fbfaf6;border-radius:3px 10px 10px 3px;box-shadow:0 14px 26px rgba(0,0,0,.45);padding:14px 44px 18px 12px;
 background-image:linear-gradient(transparent 0 calc(100% - 1px),#c3cfdf 0);background-size:100% 32px;background-position:0 8px;color:#23339a}
.nbpaper::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 35%,transparent 70%,rgba(60,40,20,.10)),radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(80,60,30,.10));pointer-events:none;z-index:4;border-radius:inherit}
.nbtop{display:flex;justify-content:space-between;align-items:center;height:32px;margin-top:-4px}
.nbtop .pd{font:500 14px var(--f-body);color:#9aa3b0;white-space:nowrap}.nbtop .pd i{font:700 18px "Aref Ruqaa",serif;color:#23339a;font-style:normal;display:inline-block;transform:rotate(-4deg);margin:0 1px}
.nbtop .wx{flex:none;width:104px;height:auto;margin-inline-start:6px}
@media (max-width:400px){.nbtop .wx{width:78px}.nbtop .pd{font-size:12px}.nbtop .pd i{font-size:16px}}
#styBtn{font-size:18px;padding:5px 10px;line-height:1}
.nbrings{position:absolute;top:0;bottom:0;right:0;width:40px;z-index:5;pointer-events:none}
.nbrings .hole{position:absolute;right:14px;width:9px;height:12px;border-radius:5px;background:#16131c;box-shadow:inset 0 2px 2px rgba(0,0,0,.6)}
.nbrings .coil{position:absolute;right:-12px;width:36px;height:26px;overflow:visible}
.hw{display:inline-block;font-family:"Aref Ruqaa",serif;font-weight:700}
.nbrows{position:relative;margin-top:8px}
.nbrow{display:flex;align-items:center;height:62px;position:relative;z-index:1}
.nblab{flex:none;width:84px;text-align:center;font-size:21px;color:#23339a}
.nbin{flex:1;min-width:0;height:100%;border:0;background:transparent;text-align:center;font:700 26px "Aref Ruqaa",serif;color:#23339a;caret-color:#23339a;outline:none;padding:0 6px}
.nbin::placeholder{color:#c2c8d4;font-size:20px}
.nbin:disabled{color:#5a66a8}
.nbrow .st{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:14px;opacity:.85}
.nbrow:focus-within::before{content:"";position:absolute;inset:6px 86px 6px 2px;border-radius:12px;background:rgba(252,196,25,.16)}
.nbw{flex:1;text-align:center;font-size:26px}.nbw b{font-weight:700}
.nbmk{flex:none;width:58px;text-align:center;font-size:24px;color:#d11a2a;line-height:1}.nbmk small{display:block;font-size:12.5px;margin-top:2px}
svg.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
svg.ink path{fill:none;stroke:#23339a;stroke-width:1.8;stroke-linecap:round;filter:url(#jhgrain);opacity:.92}
svg.ink path.r{stroke:#d11a2a;stroke-width:2.3;opacity:1}
.nbhead{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding-top:2px}.nbhead .hw{font-size:24px;white-space:nowrap;line-height:1.3}.nbhead small{font:700 13px var(--f-body);color:#8a8fa0}
.nbsum{display:flex;align-items:center;gap:10px;margin-top:10px;height:62px;color:#d11a2a;font-size:24px}
.nbsum .big{position:relative;font-size:34px;padding:0 14px}.nbsum .sm{font-size:17px}
.nbsum .big svg{position:absolute;inset:-10px -14px;width:calc(100% + 28px);height:calc(100% + 20px);overflow:visible}.nbsum .big svg path{fill:none;stroke:#d11a2a;stroke-width:2.4;filter:url(#jhgrain)}
.nbsheet{position:fixed;inset:0;z-index:60;background:rgba(22,19,28,.92);display:flex;flex-direction:column;padding:10px}
.nbsbar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:4px 6px 10px}.nbsbar .ghost{background:#fff}
.nbscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.nbscroll .nbdesk{min-width:620px;margin:0}
.nbt{width:100%;border-collapse:collapse;position:relative;z-index:1}
.nbt td,.nbt th{height:52px;text-align:center;font-size:22px;color:#23339a;padding:0 4px;font-weight:700}
.nbt th{height:44px;font-size:20px}.nbt td.l{font-size:32px}
.nbt i{display:block;font:700 16px "Aref Ruqaa",serif;color:#d11a2a;font-style:normal;line-height:1;margin-top:-4px}
.nbt td.tot{color:#d11a2a;font-size:24px}
/* the name is long: on a phone it may take two lines so the room chip stays on the screen */
@media (max-width:480px){.brand{white-space:normal;font-size:22px;line-height:1.15;min-width:0}header{align-items:flex-start}.brand .logo{flex:none}}
/* جماد حيوان إنسان: the stage, the wheel, the boxes, «ستوب», the vote and the reveal */
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:15px;background:#fff;border:2px solid var(--line);color:var(--muted)}
.cats button.on{color:#fff;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.tog{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:15px;color:var(--ink);text-align:start;padding:4px 0}
.sw{flex:none;width:52px;height:30px;border-radius:999px;background:#ced4da;position:relative;border:2px solid var(--ink);transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .2s}
.sw.on{background:var(--game)}.sw.on::after{right:24px}
.vcat{display:inline-block;color:#fff;border-radius:999px;padding:3px 14px;font-weight:800;font-size:14px;border:2px solid var(--ink)}
/* the stage */
.stage{position:relative;overflow:hidden;border-radius:26px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--game);padding:14px 8px 18px;text-align:center;color:#fff;background:#4b1a9e url(stage.jpg) center/cover;min-height:560px}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,236,153,.25),transparent 55%);pointer-events:none}
.stage>*{position:relative}
.stage .rd{display:inline-block;font-weight:800;font-size:14px;background:rgba(43,23,69,.55);border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 14px;margin-bottom:4px}
.wbox{width:100%;max-width:360px;margin:6px auto 0}
.jhw{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.jhw .sl{stroke:#fff;stroke-width:2.2;transition:filter .3s,opacity .3s}
.jhw .sl.used{filter:grayscale(.85) brightness(.75)}
.jhw .lt{font-family:Almarai,Tajawal,sans-serif;font-weight:800;font-size:31px;fill:#fff;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#2b1745;stroke-width:5px;stroke-linejoin:round}
.jhw .lt.w{font-size:24px}
.jhw .lt.used{opacity:.55}
.jhw .sl.on{filter:brightness(1.18) drop-shadow(0 0 10px #fff);stroke:#fff;stroke-width:6}
.jhw .lt.on{fill:#fff3bf;font-size:38px}
.jhw .hub{font-family:Almarai,Tajawal,sans-serif;font-weight:800;font-size:54px;fill:#fff;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#2b1745;stroke-width:4px}
.spinning .jhw .frm{animation:jhbulb .28s steps(2) infinite}
@keyframes jhbulb{0%{filter:brightness(1)}100%{filter:brightness(1.35) saturate(1.2)}}
.plq{display:inline-flex;align-items:center;gap:12px;margin-top:8px;background:linear-gradient(180deg,#fff3bf,#fcc419);color:#2b1745;border:3px solid #2b1745;border-radius:20px;box-shadow:4px 4px 0 #000;padding:6px 18px 6px 8px;font-family:var(--f-display);font-weight:800;font-size:22px;animation:fnpop .5s cubic-bezier(.2,1.6,.4,1)}
.plq[hidden]{display:none}
.plq b{width:60px;height:60px;border-radius:14px;background:#2b1745;color:#ffd43b;display:grid;place-items:center;font-size:40px;line-height:1}
.cap2{margin:12px 0 0;font-weight:800;font-size:16px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
@keyframes fnpop{from{transform:scale(.5);opacity:0}}
/* writing */
.lt2{display:flex;align-items:center;gap:12px;margin:-4px -4px 14px;padding:12px;border-radius:20px;color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--game);background:#4b1a9e url(stage.jpg) center 35%/cover}
.lt2 .t{width:70px;height:70px;flex:none;border-radius:18px;background:linear-gradient(180deg,#fff3bf,#fcc419);color:#2b1745;border:3px solid #2b1745;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.lt2 .i{flex:1;min-width:0}.lt2 b{display:block;font-family:var(--f-display);font-size:17px;text-shadow:0 1px 3px rgba(0,0,0,.4)}.lt2 span{font-weight:800;font-size:13px;opacity:.9}
.lt2 .tm{flex:none;font-family:var(--f-display);font-weight:800;font-size:24px;min-width:52px;text-align:center;background:rgba(43,23,69,.6);border-radius:12px;padding:4px 8px}
.lt2 .tm.hot{background:#e03131;animation:jhpulse .5s infinite alternate}
@keyframes jhpulse{to{transform:scale(1.08)}}
.prog2{display:flex;gap:4px;margin-top:6px}.prog2 i{flex:1;height:7px;border-radius:999px;background:rgba(255,255,255,.25)}.prog2 i.d{background:#69db7c}
.cf{display:flex;align-items:stretch;margin-bottom:10px;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff;box-shadow:2px 2px 0 var(--ink)}
.cf label{flex:none;width:80px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;text-align:center;line-height:1.2;padding:0 4px}
.cf input{flex:1;min-width:0;border:0;padding:13px 12px;font:inherit;font-weight:800;font-size:19px;color:var(--ink);background:#fff;outline:none}
.cf input:disabled{background:#f1f3f5;color:var(--muted)}
.cf:focus-within{box-shadow:0 0 0 3px #fcc419,2px 2px 0 var(--ink)}
.cf.ok input{background:#f4fdf8}.cf.no input{background:#fff5f5}
.cf .st{display:grid;place-items:center;width:34px;font-size:16px;flex:none}
.stop{display:block;width:100%;padding:16px;border-radius:18px;background:linear-gradient(180deg,#ff6b6b,#e03131);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font-family:var(--f-display);font-weight:800;font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.stop:disabled{opacity:.45}
.stop:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
/* «ستوب!» over everything */
.stopov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg),radial-gradient(circle,#ff6b6b,#a51111 75%);animation:jhin .25s ease-out}
@keyframes jhin{from{opacity:0;transform:scale(1.1)}}
.stopov .sign{width:104px;height:104px;background:#fff;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:grid;place-items:center;animation:jhpulse .45s infinite alternate}
.stopov .sign i{font-style:normal;width:92px;height:92px;background:#e03131;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:34px}
.stopov .who{font-family:var(--f-display);font-weight:800;font-size:28px;margin-top:14px}
.stopov .ring{--p:100%;width:180px;height:180px;border-radius:50%;margin:16px 0;display:grid;place-items:center;background:conic-gradient(#fff 0 var(--p),rgba(255,255,255,.2) 0)}
.stopov .ring b{width:150px;height:150px;border-radius:50%;background:#c92a2a;display:grid;place-items:center;font-family:var(--f-display);font-size:110px;line-height:1;text-shadow:5px 5px 0 rgba(0,0,0,.25)}
.stopov p{font-weight:800;font-size:18px;margin:0}
.stopov .back{margin-top:18px;background:#fff;color:#c92a2a;border-radius:999px;padding:10px 22px;font-weight:800;font-size:16px;border:2px solid #2b1745}
.stopov.mini{inset:auto;top:12px;left:12px;width:auto;height:auto;padding:8px 16px;border-radius:999px;border:3px solid #2b1745;animation:none}
.stopov.mini b{font-family:var(--f-display);font-size:22px}
/* the vote */
.vcard{text-align:center}
.vword{font-family:var(--f-display);font-weight:800;font-size:40px;margin:8px 0 2px;overflow-wrap:anywhere}
.vby{color:var(--muted);font-weight:800}
.vhint{margin:8px 0 0;background:#fff4d6;border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;color:#8a5a00}
.vbtn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.vbtn button{padding:14px;border-radius:18px;border:3px solid var(--ink);font-family:var(--f-display);font-weight:800;font-size:20px;background:#fff;color:var(--ink)}
.vbtn .y.on{background:#12a874;color:#fff;box-shadow:3px 3px 0 var(--ink)}.vbtn .n.on{background:#e03131;color:#fff;box-shadow:3px 3px 0 var(--ink)}
.vbtn button:disabled{opacity:.6}
.tally{display:flex;justify-content:center;gap:14px;margin-top:10px;font-weight:800}
/* the reveal */
.rvh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-weight:800;color:var(--muted)}
.rvh .vcat{font-size:17px;padding:4px 16px}
.rvl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rvl li{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:10px 12px;font-weight:800;animation:fnpop .4s both}
.rvl li:nth-child(2){animation-delay:.12s}.rvl li:nth-child(3){animation-delay:.24s}.rvl li:nth-child(4){animation-delay:.36s}.rvl li:nth-child(n+5){animation-delay:.48s}
.rvl li .w{flex:1;min-width:0;font-family:var(--f-display);font-size:20px;overflow-wrap:anywhere}
.rvl li .p{flex:none;font-family:var(--f-display);font-size:19px;min-width:46px;text-align:center;border-radius:10px;padding:2px 6px;background:#eee}
.rvl li.u{background:#fff4d6;outline:2px solid #f59f00}.rvl li.u .p{background:#f59f00;color:#fff}
.rvl li.s .p{background:#d3f9d8;color:#2b8a3e}
.rvl li.z{opacity:.6}
.rvl small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--f-body)}
.tag2{flex:none;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 8px;background:#fff;border:1.5px solid currentColor;white-space:nowrap}
.tag2.only{color:#d9480f}.tag2.uniq{color:#e8590c}.tag2.same{color:#2b8a3e}.tag2.bad{color:#c92a2a;white-space:normal}
.fire{text-align:center;font-family:var(--f-display);font-weight:800;font-size:17px;color:#e8590c;margin:12px 0 0}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.pager .ghost:disabled{opacity:.35}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--game)}
</style>
