name: Test, then publish
# Every push to the working branch runs the site's browser tests (tests/run.js).
# All green → the same commit goes to main and the site is published. Anything red → main is not touched.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: test-and-publish
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04   # the test browser does not support ubuntu 26 yet
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the test browser
        run: |
          cd tests
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the tests
        run: |
          cd tests
          PW="$(pwd)/node_modules/playwright/index.js" node run.js
      - name: Publish (only when every test passed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            git push origin HEAD:main
            curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          else
            echo "main has commits this branch does not have: not publishing" && exit 1
          fi
