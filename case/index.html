<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png"><link rel="icon" type="image/png" sizes="64x64" href="../favicon-64.png"><link rel="shortcut icon" href="../favicon.ico"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><meta name="theme-color" content="#1b1712">
<title>قضية الغرفة 714 · Friday Night</title>
<meta name="description" content="لعبة تحقيق: اقرأ الأدلة، قدّم نظريتك، وافتح الظروف لين تكشف القاتل.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Friday Night"><meta property="og:title" content="🕵️ قضية الغرفة 714 · Friday Night"><meta property="og:description" content="لعبة تحقيق: اقرأ الأدلة، قدّم نظريتك، وافتح الظروف لين تكشف القاتل."><meta property="og:image" content="https://fridaynight-sa.github.io/og-image.jpg"><meta property="og:locale" content="ar_SA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#1b1712; --paper:#efe6d2; --card:#fffaf0; --ink:#2b2118; --muted:#6d5b45; --line:#d8ccb3;
  --red:#8b1d1d; --gold:#f3e3b8; --good:#1f7a4d;
  --f-display:"Almarai","Tajawal",system-ui,sans-serif; --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:hidden}@supports(overflow:clip){html{overflow-x:clip}}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 20% 0,#2d2519 0,transparent 55%),radial-gradient(circle at 90% 100%,#2a1a14 0,transparent 50%);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;min-height:100vh;padding:env(safe-area-inset-top,0) 16px calc(90px + env(safe-area-inset-bottom,0))}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}
.top a{color:var(--gold);text-decoration:none;font-weight:800;font-size:14px}
.fx-mute{top:calc(10px + env(safe-area-inset-top,0px))!important;bottom:auto!important;left:16px!important;width:34px!important;height:34px!important;font-size:15px!important}
.top .trial{margin-left:46px;background:#3a2f23;color:var(--gold);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800}
.hero{text-align:center;color:var(--gold);padding:6px 0 14px}
.hero h1{font-family:var(--f-display);font-size:clamp(28px,6vw,44px);margin:0}
.hero p{margin:2px 0 8px;color:#cdbf9f;font-size:14px}
.stamp{display:inline-block;border:2px solid #d24a4a;color:#e86a6a;border-radius:6px;padding:0 10px;font-weight:800;font-size:13px;transform:rotate(-4deg)}
/* the case folder (picture) with the title written on it */
.hero.folder{position:relative;max-width:560px;margin:0 auto 10px;padding:0}
.hero.folder img{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.6))}
.hero.folder .on{position:absolute;left:9%;bottom:17%;width:54%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-7deg);color:#2b1a0b;background:#f6eedb;border:1px solid #b89a63;border-radius:4px;padding:6px 8px 8px;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.hero.folder h1{font-size:clamp(18px,5vw,32px);line-height:1.2}
.hero.folder p{color:#4a3315;font-weight:800;font-size:clamp(12px,3vw,16px);margin:2px 0 6px}
.hero.folder .stamp{border-color:#8b1d1d;color:#8b1d1d;background:rgba(255,255,255,.12)}
/* the three envelopes */
.envs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.envimg{position:relative;text-align:center}
.envimg img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.envimg b{display:block;font-size:12px;margin-top:2px}.envimg span{font-size:12px;color:var(--muted);font-weight:800}
.envimg.open img{opacity:.45}.envimg.open span{color:var(--good)}
.pic.photo{background:none;padding:0;border:0}
.pic.photo img{display:block;width:100%;height:auto;border-radius:10px;border:6px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.pic.photo figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 5px 0 var(--red)}
.card h2{font-family:var(--f-display);font-size:20px;margin:0 0 8px}
.letter{background:#fbf5e6;font-family:var(--f-body);font-size:17px}
.letter .sign{text-align:left;font-weight:800;font-size:20px}
.ask{background:#fff;border:1.5px dashed var(--muted);border-radius:12px;padding:8px 12px}
.ask ol{margin:4px 0 0;padding-inline-start:22px}
.cols{display:grid;gap:14px}
@media (min-width:860px){.cols{grid-template-columns:1.3fr 1fr;align-items:start}}
.grp{margin-bottom:10px}
.grp h3{font-family:var(--f-display);font-size:16px;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.grp h3 small{color:var(--muted);font-weight:700;font-size:12px}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ev{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:8px 4px;text-align:center;font-weight:800;font-size:15px;position:relative;line-height:1.3}
.ev small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:3px}
.ev.seen{background:#f5efe0}
.ev .new{position:absolute;top:-8px;inset-inline-start:-6px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 6px}
.env{display:flex;justify-content:space-between;align-items:center;border:2px dashed var(--red);border-radius:12px;padding:10px 12px;margin:6px 0;font-weight:800;color:var(--red);background:#fff5ec}
.btn{display:block;width:100%;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px;text-align:center;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.5}
.mt{margin-top:10px}
.missions .m{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-weight:800}
.missions .m:last-child{border:0}
.missions .m .st{margin-inline-start:auto;font-size:13px;color:var(--muted)}
.missions .m.done .st{color:var(--good)}
/* evidence sheet */
.sheet{position:fixed;inset:0;background:rgba(10,8,5,.78);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:10px}
.sheet>div{background:var(--paper);border:2px solid var(--ink);border-radius:20px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:16px}
@media (min-width:700px){.sheet{align-items:center}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sheet .hd h3{margin:0;font-family:var(--f-display);font-size:20px}
.sheet .hd .code{background:var(--ink);color:var(--gold);border-radius:8px;padding:1px 10px;font-weight:800}
.sheet .nav{display:flex;gap:8px;margin-top:12px}.sheet .nav button{flex:1}
.doc ul,.sheet ul{margin:0;padding-inline-start:20px}.doc li{margin:4px 0}
.note{background:#fff8e6;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:start;vertical-align:top}
th{background:#efe4cc}
td small{color:var(--muted)}
.q{margin:8px 0 2px}.a{margin:0 0 6px;background:#fff;border-radius:10px;padding:4px 10px}
.pic{margin:0;border:1.5px solid var(--ink);border-radius:12px;background:repeating-linear-gradient(45deg,#e7dcc4,#e7dcc4 10px,#dfd2b6 10px,#dfd2b6 20px);padding:14px;text-align:center}
.pic span{display:inline-block;background:var(--ink);color:var(--gold);border-radius:999px;padding:0 10px;font-weight:800;font-size:13px}
.pic p{margin:8px 0 0;font-size:15px}
.post{background:#fff;border-radius:10px;padding:6px 10px;margin:8px 0 0}
.sus{display:grid;gap:8px}@media (min-width:600px){.sus{grid-template-columns:1fr 1fr}}
.sus>div{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:8px 12px}
.sus h4{margin:0;font-family:var(--f-display)}.sus h4 small{color:var(--muted);font-weight:700}
.sus p{margin:4px 0;font-size:14px}.sus .why{color:var(--red);font-weight:700}
.invite{background:#132042;color:#e9cf8a;border-radius:14px;padding:18px;text-align:center;border:3px double #e9cf8a}
.invite h4{font-family:var(--f-display);font-size:22px;margin:4px 0}.invite p{margin:4px 0}
.mail{background:#fff;border-radius:10px;padding:8px 12px;border:1px solid var(--line)}.mail .meta{color:var(--muted);font-size:13px;margin:0 0 6px}
/* theory form */
.part{margin-bottom:12px}
.part h4{margin:0 0 6px;font-family:var(--f-display);font-size:17px}
.opt{display:block;width:100%;text-align:start;border:2px solid var(--ink);border-radius:12px;padding:9px 12px;margin:6px 0;font-weight:700;background:#fff}
.opt.on{background:var(--ink);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:800;background:#fff;font-size:15px}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media (min-width:860px){.chips{grid-template-columns:1fr 1fr 1fr}}
.chip{font-weight:500;font-size:13px;text-align:start;border-radius:10px;padding:6px 10px;line-height:1.35}.chip-lbl{grid-column:1/-1}.chip b{font-weight:800;font-size:14px}
.grp.flash{animation:flash 1.6s ease 2}@keyframes flash{50%{background:#ffe9b0;border-radius:12px}}
.opt{min-height:46px}
.chip-lbl{font-size:12px;color:var(--muted);width:100%;margin:6px 0 0}
.err{color:#b02020;font-weight:800;min-height:1.4em;margin:8px 0 0;text-align:center}
.hints .h{background:#fff8e6;border:1.5px solid var(--muted);border-radius:12px;padding:8px 12px;margin:6px 0;font-size:15px}
.why{margin:0;padding-inline-start:20px}.why li{margin:4px 0}
.okmsg{font-family:var(--f-display);font-size:20px;text-align:center;color:var(--good);margin:4px 0 10px}
.tl td:first-child{white-space:nowrap;font-weight:800}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stats div{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:6px 14px;text-align:center;font-weight:800}
.stats small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.reset{color:#cdbf9f;text-align:center;font-size:13px;margin-top:20px}
.reset button{color:#e9cf8a;text-decoration:underline}
/* the detective office picture behind everything, darkened so the file stays readable */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(12,8,6,.62),rgba(12,8,6,.82)),url(img/bg.jpg) center/cover no-repeat}
body{background-color:#0d0907;background-image:none}
/* movement */
html.lock,html.lock body{overflow:hidden}
.sheet.in{animation:bdin .2s ease}.sheet.in>div{animation:sheetin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes bdin{from{background:rgba(10,8,5,0)}}@keyframes sheetin{from{transform:translateY(40px);opacity:0}}
.sheet>div{transition:opacity .18s ease,transform .18s ease}.sheet>div.swap{opacity:0;transform:translateX(-14px)}
#app.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.err.shake{animation:shake .45s ease}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.openenv{position:relative;width:min(260px,70%);margin:0 auto 14px;text-align:center;color:var(--gold)}
.openenv img{display:block;width:100%;height:auto;animation:envopen 1.6s ease forwards;filter:drop-shadow(0 10px 16px rgba(0,0,0,.6))}
.openenv b{display:block;margin-top:6px;opacity:0;animation:fadein .5s ease 1.1s forwards}
@keyframes envopen{0%{transform:scale(.6) rotate(-8deg);opacity:0}35%{transform:scale(1.05) rotate(2deg);opacity:1}55%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}100%{transform:none;opacity:1}}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.openenv b{opacity:1}}
</style>
</head>

</div>
